<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top arc: counter-clockwise or clockwise from 195 deg to -15 deg (top half) -->
    <path id="top-arc" d="M 90,300 A 210,210 0 1,1 510,300" fill="none" />
    <!-- Bottom arc: from 165 deg to 15 deg (bottom half) -->
    <path id="bot-arc" d="M 505,300 A 205,205 0 0,1 95,300" fill="none" />
  </defs>

  <!-- Outer Double Circles -->
  <circle cx="300" cy="300" r="275" fill="none" stroke="#1b327b" stroke-width="7" />
  <circle cx="300" cy="300" r="260" fill="none" stroke="#1b327b" stroke-width="3" />

  <!-- Inner Circle -->
  <circle cx="300" cy="300" r="170" fill="none" stroke="#1b327b" stroke-width="4.5" />

  <!-- Top Text: জীবন বীমা কর্পোরেশন -->
  <text font-family="'Kalpurush', 'Nirmala UI', 'Vrinda', sans-serif" font-size="44" font-weight="bold" fill="#1b327b">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">জীবন বীমা কর্পোরেশন</textPath>
  </text>

  <!-- Bottom Text: ★ একমাত্র জাতীয় জীবন বীমা প্রতিষ্ঠান ★ -->
  <text font-family="'Kalpurush', 'Nirmala UI', 'Vrinda', sans-serif" font-size="28" font-weight="bold" fill="#1b327b">
    <textPath href="#bot-arc" startOffset="50%" text-anchor="middle">★ একমাত্র জাতীয় জীবন বীমা প্রতিষ্ঠান ★</textPath>
  </text>

  <!-- Center Symbol -->
  <image href="data:image/png;base64," x="175" y="172" width="250" height="256" preserveAspectRatio="xMidYMid meet" />
</svg>